[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana"
version = "0.1.0"
description = "Compliance training and tracking platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "WeGoFwd" }]
keywords = ["compliance", "training", "sox", "lms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Data validation & settings. The [email] extra pulls email-validator, which
    # pydantic imports lazily when a model builds an EmailStr field — several
    # request schemas do, so without it test collection (and startup) fails with
    # ModuleNotFoundError: email_validator.
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",  # OIDC JWKS discovery (runtime)
    # Background jobs
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    # Logging
    "structlog>=24.4.0",
    # In-process LLM generation seam (ADR-013): Pramana drafts text-first
    # compliance content (quiz items, …) through the shared provider library.
    # Library, not a service — runs in-process; managed keys passed per call.
    "wegofwd-llm[anthropic] @ git+https://github.com/wegofwd2020-hub/wegofwd-llm@v0.1.1",
    # In-process VIDEO generation seam (ADR-026): Pramana drafts a compliance
    # video to accompany a course quiz through the shared provider library.
    # Library, not a service — runs in-process; managed key passed per call. The
    # core seam has no runtime deps; the Veo SDK is the optional [veo] extra.
    "wegofwd-video @ git+https://github.com/wegofwd2020-hub/wegofwd-video@v1.1.0",
    # Object storage
    "boto3>=1.35.0",
    # PDF generation (for certificates, used in later phases)
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    # Linting & formatting
    "ruff>=0.7.0",
    # Type checking
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7",
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.1",
    "hypothesis>=6.115.0",
    "httpx>=0.27.0",  # For FastAPI test client
    # Tooling: reads project-status.yaml (scripts/render_status.py, its test)
    "PyYAML>=6.0.2",
    "types-PyYAML>=6.0.12",
    # Pre-commit
    "pre-commit>=4.0.0",
    # Security scanning
    "bandit>=1.7.10",
]
# Local video rendering (scripts/render_sox_pilot.py, ADR-026's local-preview
# role). This is the *reproducibility* environment, not just a dependency
# list: the spec's argument for rendering locally at all is "deterministic by
# seed; same seed and same torch build reproduce the frames" — so pinning it
# is a compliance requirement, not tidiness.
#
# - wegofwd-video's own [local] extra declares "transformers>=4.56" with no
#   upper bound. The pin here is transformers==5.16.1 because that is the
#   version the 98-minute pilot render actually completed on — it pins a
#   KNOWN-GOOD combination, which is what a reproducibility claim needs.
#
#   It does NOT mean 5.17.0 is known-broken. An earlier version of this
#   comment said exactly that, on the strength of one render that crashed
#   with 5.17.0 and one that succeeded with 5.16.1. That was one sample of
#   each, and 5.16.1 has since produced a SIGILL of its own. The real
#   observation is that torch's CPU kernels intermittently execute an
#   unsupported instruction on this pre-AVX2 host (i5-3570K: AVX yes, AVX2
#   no, FMA no) — the core dump's stack sits in libtorch_cpu.so on an
#   OpenMP worker thread, while torch's own dispatch already reports
#   cpu capability DEFAULT. Roughly 1 run in 5. See the SIGILL section of
#   wegofwd-video's docs/local-diffusion-cpu-poc.md.
#
#   So: keep the pin (it reproduces a run that worked), do not treat it as
#   a fix for the SIGILL, and do not bump it casually — but if you do bump
#   it, the thing to re-verify is a full render, not an import.
# - torch itself MUST be installed from the CPU wheel index, not PyPI's
#   default (which resolves the multi-GB CUDA build). An extra cannot express
#   an index URL, so this pin (matched against either index by PEP 440's
#   local-version-agnostic equality) is necessary but not sufficient — the
#   CPU index has to be passed explicitly at install time:
#     pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
#     pip install -e '.[render]'
#   This is also recorded in TICKETS/VIDEO-1-pilot-lesson-videos.md.
render = [
    "wegofwd-video[local] @ git+https://github.com/wegofwd2020-hub/wegofwd-video@v1.1.0",
    "transformers==5.16.1",
    "torch==2.14.0",
]

[project.urls]
Repository = "https://github.com/wegofwd2020-hub/pramana"

# ----------------------------------------------------------------------------
# setuptools
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["pramana*"]
exclude = ["tests*", "alembic*"]

# ----------------------------------------------------------------------------
# Ruff — linting + formatting (replaces black, isort, flake8)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # flake8-annotations (require type hints)
    "S",   # flake8-bandit (security)
    "DTZ", # flake8-datetimez (require timezone-aware datetimes)
    "RET", # flake8-return
    "PT",  # flake8-pytest-style
]
ignore = [
    "ANN401", # Allow `Any` typing where deliberate
    "S101",   # Allow `assert` (used in pytest)
]

[tool.ruff.lint.per-file-ignores]
# Tests are looser on annotations & hardcoded "passwords"; and on a few
# style/safety lints that are noise in fixtures: fixed naive datetimes (DTZ),
# broad/compound assertions in pytest.raises (PT011/PT018/B017).
"tests/**/*.py" = ["ANN", "S105", "S106", "DTZ", "PT011", "PT018", "B017"]
"alembic/env.py" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------------
# mypy — strict type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "celery.*", "factory.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: Pure unit tests, no I/O",
    "integration: Integration tests requiring DB/Redis",
    "slow: Tests slower than 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    # starlette>=1.2 deprecates httpx in its TestClient (suggests httpx2); the
    # warning fires on import of fastapi/starlette TestClient — third-party, not
    # our code. Re-evaluate when migrating the test client to httpx2.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # anyio 4.15.0 (released 2026-09-02) deprecated the anyio.abc.BlockingPortal
    # alias. It fires on import of fastapi/starlette's TestClient, which reaches
    # it through anyio's own re-export — third-party, not our code, and not
    # reachable from here. Matched on the message so other anyio deprecations
    # still fail the build. Drop this when starlette moves to
    # anyio.from_thread.BlockingPortal.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

# ----------------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["pramana"]
branch = true
omit = ["pramana/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

# ----------------------------------------------------------------------------
# bandit — security scanning
# ----------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]  # assert_used (we control its use)
