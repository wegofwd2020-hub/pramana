# Host nginx server block for pramana.mambakkam.net.
#
# This file exists in the repository on purpose. The host nginx configuration
# and its TLS certificates previously lived only on the box — not in git, not in
# compose — and that is what caused the July 2026 outage on this host. Adding a
# second application behind the same unversioned config would double what one
# manual edit can break, and this one is a compliance product.
#
# Install:
#     sudo cp deploy/nginx/pramana.mambakkam.net.conf \
#             /etc/nginx/sites-available/pramana.mambakkam.net.conf
#     sudo ln -sf /etc/nginx/sites-available/pramana.mambakkam.net.conf \
#                 /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites on the box:
#   * A Cloudflare Origin CA certificate valid for pramana.mambakkam.net.
#     VERIFY FIRST whether the existing mambakkam.net cert covers the subdomain;
#     if it is apex-only, issue one with the subdomain in its SAN.
#   * The Cloudflare DNS record must be **Proxied** (orange). Grey-cloud sends
#     browsers straight to the origin, which then presents an Origin CA
#     certificate no public root trusts — the failure mode www.mambakkam.net
#     has been in since July.
#   * The API listening on 127.0.0.1:${API_PORT} (compose binds loopback).

# ---------------------------------------------------------------------------
# Real client IP
# ---------------------------------------------------------------------------
# Requests arrive from Cloudflare, so the socket peer is Cloudflare's edge.
# Without restoring the real address, `attestation_ip` — SOX evidence — records
# Cloudflare for every learner: a valid IP, in the audit chain, identifying
# nobody. set_real_ip_from lists the only peers whose forwarded header is
# believed; anything else cannot spoof it.
#
# Refresh from https://www.cloudflare.com/ips/ when Cloudflare publishes changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pramana.mambakkam.net;

    ssl_certificate     /etc/ssl/cloudflare/pramana.mambakkam.net-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pramana.mambakkam.net-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Certificates and audit exports are the large responses here.
    client_max_body_size 20m;
    proxy_read_timeout 60s;

    access_log /var/log/nginx/pramana.access.log;
    error_log  /var/log/nginx/pramana.error.log;

    # The interactive docs publish every route and schema of a compliance
    # product. The application already disables them outside development; this
    # is the second lock, so a misread ENVIRONMENT does not expose them.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Liveness and readiness are for the orchestrator, not the internet.
    location ~ ^/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pramana.mambakkam.net;
    return 301 https://$host$request_uri;
}
