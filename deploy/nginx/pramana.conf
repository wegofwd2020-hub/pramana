# Pramana — host nginx path-mount block.
#
# Pramana is served under a path prefix on the shared box:
#   https://mambakkam.net/pramana
#
# This file is VERSIONED deliberately. Host nginx and its TLS certificates live
# on the box, outside compose and outside git; an unversioned manual edit caused
# a July outage, and Pramana is a compliance product sharing that same nginx with
# StudyBuddy. Keeping the block here means a review can see it and a deploy can
# copy it into place rather than hand-editing on the server.
#
# Topology (verified 2026-09-02): Cloudflare (proxied) -> host nginx :443
# terminating origin TLS -> this location -> the Pramana container on
# 127.0.0.1:8000 (compose binds it loopback-only; it is never public).
#
# Drop this `location` block inside the existing `server { listen 443 ssl; }`
# block for mambakkam.net. It does not define its own server/TLS — those already
# exist for StudyBuddy and are shared.

location /pramana/ {
    # Trailing slash on BOTH sides strips the /pramana prefix before the request
    # reaches the app: nginx maps /pramana/foo -> /foo upstream. The app's
    # FastAPI root_path re-adds the prefix in /docs and OpenAPI links, so the two
    # must agree — root_path is derived from PUBLIC_BASE_URL (…/pramana).
    proxy_pass http://127.0.0.1:8000/;

    # The socket peer here is Cloudflare's edge, not the visitor. CF-Connecting-IP
    # is the real client address; hand it to uvicorn as X-Forwarded-For. uvicorn
    # runs with --proxy-headers and a scoped --forwarded-allow-ips, so it trusts
    # THIS hop — which means nginx must supply the truth. Without it every
    # completion attestation records nginx's own IP: a valid address in the SOX
    # audit chain that identifies nobody.
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    # Informational — the app sets root_path itself, but a correct prefix header
    # keeps any proxy-aware middleware honest.
    proxy_set_header X-Forwarded-Prefix /pramana;
    proxy_set_header Host              $host;

    proxy_http_version 1.1;

    # Certificate/binder PDFs render on demand and can take a few seconds.
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
}

# A bare /pramana (no trailing slash) would miss the block above; redirect it so
# the OpenAPI docs and hand-typed URLs land on the mount.
location = /pramana {
    return 308 /pramana/;
}
