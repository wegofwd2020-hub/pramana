scenes:
  - id: 1
    narration: "Section 404 requires management to assess internal control over financial reporting."
    visual: { kind: text, headline: "Section 404: internal control" }
  - id: 2
    narration: "Management designs the controls, tests them, reports any deficiencies, and assesses the result."
    visual:
      kind: flow
      steps: ["Design controls", "Test controls", "Report deficiencies", "Assess"]
  - id: 3
    narration: "Staff in finance, IT and internal audit must be trained on these controls."
    visual: { kind: roster, groups: ["Finance", "IT", "Internal audit"] }
  - id: 4
    narration: "Each in-scope person completes the course, passes the quiz, and repeats it every year."
    visual:
      kind: checklist
      items: ["Know the controls you own", "Report suspected fraud", "Complete this course yearly"]
  - id: 5
    narration: "Completion is recorded in a tamper-evident audit trail, ready for the external auditor."
    visual: { kind: text, headline: "Evidence: who, when, which version" }
