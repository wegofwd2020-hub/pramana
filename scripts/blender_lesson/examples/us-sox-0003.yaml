scenes:
  - id: 1
    narration: "This lesson covers how to spot financial fraud, how to report it, and how the law protects you when you do."
    visual: { kind: text, headline: "Fraud awareness and reporting" }
  - id: 2
    narration: "Something doesn't look right. A vendor payment was approved without the second signature, again."
    visual: { kind: dialogue, speaker: intern }
  - id: 3
    narration: "Good catch. Tell me exactly what you saw, and when you saw it."
    visual: { kind: dialogue, speaker: manager }
