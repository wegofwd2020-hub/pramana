    narration: "Should I say something? I'm new, and I don't want to look like I'm making trouble."
    visual: { kind: dialogue, speaker: intern }
  - id: 5
    narration: "Raising a concern in good faith is part of the job. Section 806 protects you from retaliation for reporting suspected fraud."
    visual: { kind: dialogue, speaker: manager }
  - id: 6
    narration: "What counts as a red flag? I want to get it right."
    visual: { kind: dialogue, speaker: intern }
