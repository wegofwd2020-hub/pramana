    narration: "Missing approvals, payments to unfamiliar vendors, records changed after the fact, and pressure to skip a control."
    visual: { kind: dialogue, speaker: manager }
  - id: 8
    narration: "What if I'm not comfortable going to my manager?"
    visual: { kind: dialogue, speaker: intern }
  - id: 9
    narration: "Use any channel: your manager, Compliance, or the anonymous hotline. You can stay anonymous."
    visual: { kind: dialogue, speaker: manager }
